# =============================================================================
# PAIC Paper Agent — Publicação após Aprovação
# =============================================================================

name: "🚀 Publish Approved Paper"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  check-approval:
    if: |
      contains(github.event.comment.body, 'approved') &&
      contains(join(github.event.issue.labels.*.name, ','), 'paper-proposal')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install anthropic requests pyyaml

      - name: ✅ Verify authorized user
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          AUTHORIZED_USERS="rhozon"
          if echo "$AUTHORIZED_USERS" | grep -qw "$COMMENT_AUTHOR"; then
            echo "✅ Autorizado: $COMMENT_AUTHOR"
          else
            echo "❌ Não autorizado: $COMMENT_AUTHOR"
            exit 1
          fi

      - name: 🚀 Create PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd paic-agents
          python agents/orchestrator.py publish ${{ github.event.issue.number }}
